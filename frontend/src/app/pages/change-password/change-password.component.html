<div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
        <h2 class="fw-bold text-white">Change Password</h2>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">

                        <h6 class="text-primary mb-3">
                            <i class="eva eva-lock-outline me-2"></i>Security Credentials
                        </h6>

                        <!-- Current Password -->
                        <div class="mb-3">
                            <label class="form-label text-white">Current Password <span
                                    class="text-danger">*</span></label>
                            <div class="input-group">
                                <input [type]="showCurrentPassword ? 'text' : 'password'" class="form-control"
                                    formControlName="currentPassword"
                                    [class.is-invalid]="changePasswordForm.get('currentPassword')?.invalid && changePasswordForm.get('currentPassword')?.touched"
                                    placeholder="Enter current password">
                                <button class="btn btn-outline-secondary border-start-0" type="button"
                                    (click)="showCurrentPassword = !showCurrentPassword">
                                    <i class="eva" [class.eva-eye-outline]="!showCurrentPassword"
                                        [class.eva-eye-off-outline]="showCurrentPassword"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback d-block"
                                *ngIf="changePasswordForm.get('currentPassword')?.errors?.['required'] && changePasswordForm.get('currentPassword')?.touched">
                                Current password is required
                            </div>
                        </div>

                        <!-- New Password -->
                        <div class="mb-3">
                            <label class="form-label text-white">New Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input [type]="showNewPassword ? 'text' : 'password'" class="form-control"
                                    formControlName="newPassword"
                                    [class.is-invalid]="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched"
                                    placeholder="Enter new password">
                                <button class="btn btn-outline-secondary border-start-0" type="button"
                                    (click)="showNewPassword = !showNewPassword">
                                    <i class="eva" [class.eva-eye-outline]="!showNewPassword"
                                        [class.eva-eye-off-outline]="showNewPassword"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback d-block"
                                *ngIf="changePasswordForm.get('newPassword')?.errors?.['required'] && changePasswordForm.get('newPassword')?.touched">
                                New password is required
                            </div>
                            <div class="invalid-feedback d-block"
                                *ngIf="changePasswordForm.get('newPassword')?.errors?.['minlength'] && changePasswordForm.get('newPassword')?.touched">
                                Password must be at least 6 characters
                            </div>
                        </div>

                        <!-- Confirm New Password -->
                        <div class="mb-3">
                            <label class="form-label text-white">Confirm New Password <span
                                    class="text-danger">*</span></label>
                            <div class="input-group">
                                <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control"
                                    formControlName="confirmNewPassword"
                                    [class.is-invalid]="(changePasswordForm.get('confirmNewPassword')?.invalid || changePasswordForm.errors?.['mismatch']) && changePasswordForm.get('confirmNewPassword')?.touched"
                                    placeholder="Confirm new password">
                                <button class="btn btn-outline-secondary border-start-0" type="button"
                                    (click)="showConfirmPassword = !showConfirmPassword">
                                    <i class="eva" [class.eva-eye-outline]="!showConfirmPassword"
                                        [class.eva-eye-off-outline]="showConfirmPassword"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback d-block"
                                *ngIf="changePasswordForm.get('confirmNewPassword')?.errors?.['required'] && changePasswordForm.get('confirmNewPassword')?.touched">
                                Please confirm your new password
                            </div>
                            <div class="invalid-feedback d-block"
                                *ngIf="changePasswordForm.errors?.['mismatch'] && changePasswordForm.get('confirmNewPassword')?.touched">
                                Passwords do not match
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary" [disabled]="changePasswordForm.invalid">
                                Change Password
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
